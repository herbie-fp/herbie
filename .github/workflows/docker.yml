name: Docker image

# The demo image, ghcr.io/herbie-fp/herbie: weekly from main, at each
# release tag, and by hand. Built from the Dockerfile, smoke-tested
# (/up answers), then pushed. Tags: main for the weekly build, the
# version and latest for a release, and the commit for every build.
# A pull request that touches the build gets the build and the test,
# not the push.

on:
  schedule:
    - cron: "17 10 * * 1"   # Mondays, 10:17 UTC, off the busy hour
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build, test, push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: herbie:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name demo -p 127.0.0.1:8000:80 herbie:test
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/up && exit 0
            sleep 2
          done
          docker logs demo
          exit 1

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
